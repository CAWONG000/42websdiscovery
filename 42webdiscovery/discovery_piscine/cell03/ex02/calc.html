<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>It's Over 9000!</title>
    <link rel="stylesheet" href="calc.css">
</head>

<body>

    <h1>It's Over 9000!</h1>

    <form id="calculator">

        <input type="text" id="left" placeholder="First number">

        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
            <option value="%">%</option>
        </select>

        <input type="text" id="right" placeholder="Second number">

        <input type="submit" value="Try me!">

    </form>

    <script src="calc.js"></script>

</body>
</html>
